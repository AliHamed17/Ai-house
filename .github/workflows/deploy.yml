# Publishes the site to Vercel from GitHub Actions.
#
# This exists because the app has no public URL: it is only ever run locally
# or in CI. Deploying needs a Vercel account, and that account's credentials
# belong to the repository owner, not to any contributor or agent — so the
# deploy runs here, reading three repository secrets, rather than from anyone's
# machine.
#
# SETUP (once, ~2 minutes):
#   1. Create the project on Vercel:  npx vercel link
#      That writes .vercel/project.json containing "orgId" and "projectId".
#   2. Create a token at https://vercel.com/account/settings/tokens
#   3. Add three repository secrets under
#      Settings -> Secrets and variables -> Actions -> New repository secret:
#        VERCEL_TOKEN       the token from step 2
#        VERCEL_ORG_ID      "orgId"     from .vercel/project.json
#        VERCEL_PROJECT_ID  "projectId" from .vercel/project.json
#   4. Give the VERCEL PROJECT (not this repository) a stable
#      JOB_ID_SIGNING_SECRET, for every environment you deploy to:
#        Vercel -> the project -> Settings -> Environment Variables
#        JOB_ID_SIGNING_SECRET = any long random string, e.g. openssl rand -hex 32
#      Vercel runs the app as concurrent serverless instances, and without a
#      shared secret each one signs job ids with its own random per-process
#      key (see src/lib/ai/jobId.ts). A status poll then lands on a different
#      instance than the submit did and rejects a legitimate id — which breaks
#      the AI Studio even in demo mode, the only mode this deployment runs in.
#      The deploy below refuses to publish without it rather than shipping a
#      site whose advertised Studio is quietly broken.
#   5. Run this workflow: Actions -> Deploy -> Run workflow.
#      The deployment URL is printed in the job summary.
#
# Until the three repository secrets exist the workflow SKIPS rather than
# fails, so a fork or a clone that never intends to deploy is never shown a red
# X for it. A missing JOB_ID_SIGNING_SECRET is different and is a hard failure:
# by then the repository has said it wants to deploy, and the only question is
# whether what gets published actually works.
#
# The deployment gets NO AI credentials, which is deliberate: with none set the
# app serves its full demo mode (see src/lib/ai/registry.server.ts), so the
# published site is completely usable and cannot spend anyone's money. Turning
# on real generation is a separate, considered decision — AI_ALLOW_LIVE plus a
# provider key, and, as README.md's own warning says, real authentication and
# quotas in front of the /api/*/generate routes first, because the
# cost-confirmation step is client-side and is not a server-side control.
name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'preview (a throwaway URL) or production (the project domain)'
        type: choice
        options: [preview, production]
        default: preview
  push:
    branches:
      - main

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy to Vercel
    runs-on: ubuntu-latest
    steps:
      - name: Check for deploy credentials
        id: creds
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          # Secrets are not readable in an `if:` expression, so the gate has to
          # be a step that sets an output the later steps key off.
          if [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Deploy skipped"
              echo
              echo "No Vercel credentials are configured for this repository, so there is nothing to deploy to."
              echo "See the setup steps at the top of \`.github/workflows/deploy.yml\` — it takes about two minutes."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Checkout
        if: steps.creds.outputs.ready == 'true'
        uses: actions/checkout@v4

      - name: Set up Node.js
        if: steps.creds.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.creds.outputs.ready == 'true'
        run: npm ci

      # Deliberately re-run here rather than trusted from CI: a push to main can
      # reach this workflow without the CI run having finished, and publishing a
      # build that does not typecheck or whose tests fail is worse than
      # publishing nothing. The Playwright suite is NOT repeated — CI owns that,
      # it takes ~8 minutes, and it needs a browser download this job has no
      # other use for.
      - name: Type check
        if: steps.creds.outputs.ready == 'true'
        run: npm run typecheck

      - name: Unit tests
        if: steps.creds.outputs.ready == 'true'
        run: npm run test

      - name: Build for Vercel
        if: steps.creds.outputs.ready == 'true'
        env:
          # The CLI reads all three from the environment; passing the token as
          # --token would put it in the process's argv, readable by anything
          # else on the runner.
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          TARGET: ${{ inputs.environment || 'preview' }}
        run: |
          set -euo pipefail
          npx --yes vercel@latest pull --yes --environment="$TARGET"

          # `vercel pull` writes the project's own environment for this target
          # to a dotenv file, which is the only view this job gets of what the
          # deployed functions will actually run with. Checking it here means
          # the check is against the real deployment configuration rather than
          # against a repository secret standing in for it.
          #
          # Nothing below ever prints the value — only whether there is one.
          ENV_FILE=".vercel/.env.${TARGET}.local"
          if [ ! -f "$ENV_FILE" ]; then
            echo "::error::vercel pull did not write $ENV_FILE, so the deployment's runtime configuration cannot be verified."
            exit 1
          fi
          # Reads one variable out of that dotenv file. Values are only ever
          # held in shell variables and tested for emptiness — never printed,
          # and never passed as an argument to anything.
          dotenv_value() {
            local line value
            line=$(grep -m1 "^$1=" "$ENV_FILE" || true)
            [ -n "$line" ] || return 0
            value=${line#*=}
            # Vercel quotes dotenv values.
            value=${value%\"}; value=${value#\"}
            value=${value%\'}; value=${value#\'}
            printf '%s' "$value"
          }

          # This workflow's whole promise is a deployment that CANNOT spend
          # money — it is stated in the job summary and in README. That is a
          # claim about the Vercel project's runtime configuration, which is
          # exactly what was just pulled, so it gets checked rather than
          # assumed. With the live switch on and a provider credential
          # present, the published /api/*/generate routes are public,
          # unauthenticated and billed.
          #
          # Rejecting is the only honest option here: stripping these from the
          # pulled file would change nothing, because the deployed functions
          # read the PROJECT's environment, not this runner's copy of it.
          LIVE_VARS=''
          if [ "$(dotenv_value AI_ALLOW_LIVE)" = 'true' ]; then
            LIVE_VARS="$LIVE_VARS AI_ALLOW_LIVE"
          fi
          for VAR in GEMINI_API_KEY GOOGLE_API_KEY HF_CREDENTIALS HF_API_KEY HF_API_SECRET; do
            if [ -n "$(dotenv_value "$VAR")" ]; then
              LIVE_VARS="$LIVE_VARS $VAR"
            fi
          done
          if [ -n "$LIVE_VARS" ]; then
            {
              echo "### Deploy stopped: this environment is not demo-only"
              echo
              echo "The Vercel project's \`$TARGET\` environment sets \`${LIVE_VARS# }\`."
              echo
              echo "This workflow publishes a deployment it describes as unable to spend money, and that is no longer true here: the \`/api/*/generate\` routes are public and unauthenticated, so a live switch plus a provider credential makes them a billable endpoint for anyone who finds the URL."
              echo
              echo "Either remove those variables from this environment on the Vercel project, or deploy it by hand — but read README's \`AI_ALLOW_LIVE\` warning about putting authentication and quotas in front of those routes first."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Refusing to publish a 'demo-only' deployment whose Vercel environment enables live generation (${LIVE_VARS# }). See the job summary."
            exit 1
          fi

          MISSING_SECRET=''
          if SECRET_LINE=$(grep -m1 '^JOB_ID_SIGNING_SECRET=' "$ENV_FILE"); then
            # An empty value signs with the same random per-process fallback
            # as no value at all, so both fail.
            [ -n "$(dotenv_value JOB_ID_SIGNING_SECRET)" ] || MISSING_SECRET='empty'
          else
            MISSING_SECRET='absent'
          fi
          if [ -n "$MISSING_SECRET" ]; then
            {
              echo "### Deploy stopped: no stable JOB_ID_SIGNING_SECRET"
              echo
              echo "The Vercel project has no usable \`JOB_ID_SIGNING_SECRET\` for the \`$TARGET\` environment (it is $MISSING_SECRET)."
              echo "Vercel runs this app as concurrent serverless instances; without a shared secret each signs job ids with its own random per-process key, so a status poll landing on a different instance rejects a legitimate id and the AI Studio fails **even in demo mode**."
              echo
              echo "Set it under **Settings -> Environment Variables** on the Vercel project (any long random string, e.g. \`openssl rand -hex 32\`), then re-run."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::No usable JOB_ID_SIGNING_SECRET on the Vercel project for '$TARGET' ($MISSING_SECRET) — refusing to publish a deployment whose AI Studio cannot work. See the job summary."
            exit 1
          fi

          if [ "$TARGET" = 'production' ]; then
            npx --yes vercel@latest build --prod
          else
            npx --yes vercel@latest build
          fi

      - name: Deploy
        if: steps.creds.outputs.ready == 'true'
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          TARGET: ${{ inputs.environment || 'preview' }}
        run: |
          set -euo pipefail
          if [ "$TARGET" = 'production' ]; then
            OUTPUT=$(npx --yes vercel@latest deploy --prebuilt --prod)
          else
            OUTPUT=$(npx --yes vercel@latest deploy --prebuilt)
          fi
          # The CLI writes progress to stderr and the URL to stdout, but taking
          # the last line rather than the whole capture means a future version
          # that adds a stdout line cannot turn the URL into an unusable blob.
          URL=$(printf '%s\n' "$OUTPUT" | tail -n 1)
          case "$URL" in
            https://*) ;;
            *) echo "::error::vercel deploy did not print a URL; got: $OUTPUT"; exit 1 ;;
          esac
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          {
            echo "### Deployed"
            echo
            echo "**$URL**"
            echo
            echo "Commit \`${GITHUB_SHA:0:7}\` · target \`$TARGET\`"
            echo
            echo "The AI Design Studio runs in demo mode: this deployment is given no provider credentials, so it cannot spend money."
          } >> "$GITHUB_STEP_SUMMARY"

      # A deployment that 500s on its own landing page is not a deployment. One
      # request against the URL just published is enough to catch a broken
      # runtime config that a local build cannot see.
      - name: Smoke-test the deployment
        if: steps.creds.outputs.ready == 'true'
        env:
          # Through the environment, not interpolated into the script: a step
          # output spliced into shell source is a command-injection shape, and
          # there is no reason to write one even when the value is our own.
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            CODE=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "$URL" || echo 000)
            if [ "$CODE" = '200' ]; then
              echo "OK: $URL returned 200"
              exit 0
            fi
            echo "attempt $attempt: $URL returned $CODE; retrying in 10s"
            sleep 10
          done
          echo "::error::$URL never returned 200 — the deployment is live but not serving."
          exit 1
